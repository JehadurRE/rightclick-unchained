<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo Tile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      background: radial-gradient(ellipse at 80% 20%, rgba(99, 102, 241, 0.35), transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(6, 182, 212, 0.25), transparent 60%),
                  #070B14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
    }

    .badge-icon {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 14px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    h1 span {
      background: linear-gradient(135deg, #818CF8, #22D3EE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 12px;
      color: #94A3B8;
      max-width: 320px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .pills {
      display: flex;
      gap: 8px;
    }

    .pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: 0.02em;
    }

    .pill.glow {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
      color: #C7D2FE;
    }
  </style>
</head>
<body>
  <div class="badge-icon">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
    </svg>
  </div>
  <h1>RightClick <span>Unchained</span></h1>
  <p>Universal Copy, Selection & Form Paste Freedom Across Any Website</p>
  <div class="pills">
    <span class="pill glow">Manifest V3</span>
    <span class="pill">Smart Lasso</span>
    <span class="pill">0 Telemetry</span>
  </div>
</body>
</html>
