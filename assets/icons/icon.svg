<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Shackle (unlocked) -->
  <path d="M 46 54 L 46 40 C 46 27.85 55.85 18 68 18 C 80.15 18 90 27.85 90 40 L 90 48" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="34" y="52" width="60" height="48" rx="12" fill="#FFFFFF"/>

  <!-- Keyhole -->
  <circle cx="64" cy="70" r="6" fill="#4F46E5"/>
  <polygon points="61,72 67,72 69,84 59,84" fill="#4F46E5"/>
  
  <!-- Magic sparkle / spark indicating unblocking -->
  <path d="M 98 28 L 100 34 L 106 36 L 100 38 L 98 44 L 96 38 L 90 36 L 96 34 Z" fill="#FACC15"/>
</svg>
